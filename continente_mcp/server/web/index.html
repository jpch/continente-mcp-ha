<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title"></title>
  <link rel="stylesheet" href="web/style.css">
</head>
<body>
  <header>
    <h1 data-i18n="app.title"></h1>
    <p class="disclaimer" data-i18n="app.disclaimer"></p>
    <div id="checkout-on" class="banner" hidden data-i18n="status.checkout_on"></div>
  </header>

  <section>
    <h2 data-i18n="status.title"></h2>
    <dl>
      <dt data-i18n="status.version"></dt><dd id="version"></dd>
      <dt data-i18n="status.session"></dt><dd id="session"></dd>
      <dt data-i18n="status.queue"></dt><dd id="queue"></dd>
      <dt data-i18n="status.endpoint"></dt><dd><code id="endpoint"></code></dd>
    </dl>
    <button id="check-session" data-i18n="status.check"></button>
  </section>

  <section>
    <h2 data-i18n="account.title"></h2>
    <p id="account-state"></p>
    <form id="account-form" autocomplete="off">
      <label><span data-i18n="account.email"></span><input type="email" name="email" required></label>
      <label><span data-i18n="account.password"></span><input type="password" name="password" required autocomplete="new-password"></label>
      <button type="submit" data-i18n="account.save"></button>
      <button type="button" id="account-remove" data-i18n="account.remove"></button>
    </form>
  </section>

  <section>
    <h2 data-i18n="login.title"></h2>
    <p data-i18n="login.help"></p>
    <p id="login-state"></p>
    <button id="login-start" data-i18n="login.start"></button>
    <button id="login-cancel" data-i18n="login.cancel" hidden></button>
    <iframe id="vnc" title="noVNC" hidden></iframe>
  </section>

  <section>
    <h2 data-i18n="tokens.title"></h2>
    <p data-i18n="tokens.help"></p>
    <table>
      <thead><tr><th data-i18n="tokens.name"></th><th data-i18n="tokens.priority"></th><th data-i18n="tokens.created"></th><th data-i18n="tokens.last_used"></th><th></th></tr></thead>
      <tbody id="tokens"></tbody>
    </table>
    <form id="token-form" autocomplete="off">
      <label><span data-i18n="tokens.name"></span><input name="name" required maxlength="40"></label>
      <label><input type="checkbox" name="priority"> <span data-i18n="tokens.priority_help"></span></label>
      <button type="submit" data-i18n="tokens.create"></button>
    </form>
    <div id="new-token" class="banner" hidden>
      <p data-i18n="tokens.copy_now"></p>
      <code id="new-token-value"></code>
      <p><button type="button" id="new-token-copy" data-i18n="tokens.copy"></button> <button type="button" id="new-token-hide" data-i18n="tokens.hide"></button></p>
    </div>
  </section>

  <section id="requests-section" hidden>
    <h2 data-i18n="requests.title"></h2>
    <p data-i18n="requests.help"></p>
    <table>
      <thead><tr><th data-i18n="tokens.name"></th><th data-i18n="requests.fingerprint"></th><th data-i18n="tokens.priority"></th><th></th></tr></thead>
      <tbody id="requests"></tbody>
    </table>
  </section>

  <p id="message" role="status"></p>
  <script src="web/app.js"></script>
</body>
</html>
