configuration:
  allow_checkout:
    name: Allow checkout and payment tools
    description: "Off (default): any tool that looks like checkout, payment, placing an order, delivery slots, billing or cards is hidden and refused for every token. On: such tools, if continentept-mcp ever offers one and it passed the contract review, become available to every token. The installed version has none. Coupon and voucher tools are never available, not even with this on."
  session_keepalive:
    name: Keep the Continente session alive
    description: "Off (default). On: while the session is valid, one read-only cart check (get_cart) after the set minutes without any Continente request, so the session does not end after about 30 idle minutes. It waits behind every agent call, stops when the session has expired and never signs in."
  session_keepalive_minutes:
    name: Keep-alive interval (minutes)
    description: "10 to 45, default 15. Counted from the last Continente request, with ±20% random variation. Continente ends an idle session after about 30 minutes."
  session_keepalive_max_hours:
    name: Keep-alive limit (hours)
    description: "0 to 72, default 6. The keep-alive stops this many hours after the sign-in (Continente is expected to end a session after about 6 hours anyway). 0: no limit."
  unattended_sign_in:
    name: Sign in again without you
    description: "On (default, as before): when the session has expired, continentept-mcp signs in again on its own in a hidden browser with the saved password. That fails when Continente asks for \"Não sou um robô\". Off: it never signs in on its own; you sign in on the add-on page when the notification asks."
  session_sensor:
    name: Session sensor
    description: "Off (default). On: publishes binary_sensor.continente_mcp_session (on while the Continente session is valid). The session-expired notification is always shown."
  log_level:
    name: Log level
network:
  8100/tcp: MCP endpoint for agents on the home network (/mcp, token required)
